services:
  gateway:
    build:
      context: .
      args:
        PROJECT: Gateway
    environment:
      Services__Auth: http://auth:8080
      Services__Control: http://control:8080
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - control

  auth:
    build:
      context: .
      args:
        PROJECT: Auth.Api
    environment:
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-metrica_app};Username=${POSTGRES_USER:-metrica};Password=${POSTGRES_PASSWORD:-metrica_dev}
    depends_on:
      - postgres

  control:
    build:
      context: .
      args:
        PROJECT: Control.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-metrica_app};Username=${POSTGRES_USER:-metrica};Password=${POSTGRES_PASSWORD:-metrica_dev}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_DEFAULT_USER:-metrica}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:-metrica_dev}
      SeaweedFS__FilerUrl: http://seaweedfs:8888
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres
      - rabbitmq
      - seaweedfs

  processing:
    build:
      context: .
      args:
        PROJECT: Processing.Worker
    environment:
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-metrica_app};Username=${POSTGRES_USER:-metrica};Password=${POSTGRES_PASSWORD:-metrica_dev}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_DEFAULT_USER:-metrica}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:-metrica_dev}
      SeaweedFS__FilerUrl: http://seaweedfs:8888
    depends_on:
      - postgres
      - rabbitmq
      - seaweedfs

  notifications:
    build:
      context: .
      args:
        PROJECT: Notifications.Worker
    environment:
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-metrica_app};Username=${POSTGRES_USER:-metrica};Password=${POSTGRES_PASSWORD:-metrica_dev}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_DEFAULT_USER:-metrica}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS:-metrica_dev}
    depends_on:
      - postgres
      - rabbitmq

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metrica_app}
      POSTGRES_USER: ${POSTGRES_USER:-metrica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metrica_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-metrica}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-metrica_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -filer -ip=seaweedfs
    ports:
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  rabbitmq_data:
  seaweedfs_data:
